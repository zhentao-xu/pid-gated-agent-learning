name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ------------------------------------------------------------------
  # Full test matrix: every supported Python × every supported OS.
  # fail-fast: false so one failing cell doesn't mask others.
  # ------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project + dev group
        run: uv sync --python ${{ matrix.python-version }}

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Tests (pytest)
        run: uv run pytest -q

  # ------------------------------------------------------------------
  # Verify the package builds a valid sdist + wheel on every platform
  # and that the resulting metadata passes PyPI's checks.
  # ------------------------------------------------------------------
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Build sdist + wheel
        run: uv build

      - name: Validate package metadata
        run: uvx twine check dist/*

  # ------------------------------------------------------------------
  # Core install (no provider extras, no dev group). Confirms the
  # library imports cleanly with zero dependencies and that each
  # provider adapter raises a helpful ImportError when its SDK is
  # absent — the contract users rely on when they install just one
  # provider extra.
  # ------------------------------------------------------------------
  install-no-extras:
    name: install-no-extras (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core only (no extras, no dev group)
        run: python -m pip install .

      - name: Import smoke test + provider ImportError contract
        shell: python
        run: |
          import pid_gated_agent_learning as p

          # Core API surface loads with zero deps.
          assert p.__version__
          for name in [
              "IntegralGate",
              "ProportionalGate",
              "DerivativeGate",
              "Scheduler",
              "Parity",
              "GuessNumber",
              "MovingTarget",
              "MockProvider",
              "CachedProvider",
          ]:
              assert hasattr(p, name), f"missing: {name}"

          # Each provider adapter must raise a *helpful* ImportError when
          # its SDK isn't installed (we did not install any extras here).
          for cls, needle in [
              (p.OpenAIProvider, "openai"),
              (p.AnthropicProvider, "anthropic"),
              (p.GeminiProvider, "google-genai"),
              (p.DeepSeekProvider, "openai"),
              (p.OllamaProvider, "httpx"),
          ]:
              try:
                  cls(api_key="dummy") if cls is not p.OllamaProvider else cls()
              except ImportError as e:
                  assert needle in str(e), f"{cls.__name__} ImportError missing '{needle}': {e}"
              else:
                  raise AssertionError(f"{cls.__name__} should have raised ImportError")

          # MockProvider needs no deps and must work.
          m = p.MockProvider(response="hi")
          assert m.generate("x") == "hi"
          print("OK on", p.__version__)
